name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'database/**'
      - 'ai-engine/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'database/**'
      - 'ai-engine/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Validate Project Structure & Rules
        run: node scripts/validate-structure.js

      - name: Run Backend & AI Unit Tests
        run: npm test --workspaces --if-present

